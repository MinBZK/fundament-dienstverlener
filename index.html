<!doctype html>
<html lang="nl" data-scheme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MOZa Dienstverlener · MijnOverheid Zakelijk</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/src/stijl.css">
    <link rel="stylesheet" href="/src/start.css">
    <script type="module" src="/src/start.ts"></script>
  </head>
  <body>
    <div class="start">
      <main class="start-inhoud">
        <p class="start-overline">MijnOverheid Zakelijk · Mock-dienstverlener</p>
        <h1 class="start-titel">MOZa Dienstverlener</h1>
        <p class="start-lead">Dit is een mock-dienstverlener: een nagebootste dienstverlener die we gebruiken voor testdoeleinden.</p>

        <h2 class="start-kop">Demo</h2>
        <nldd-collection
          class="start-keuzes"
          item-min-width="230px"
          gap="24"
        >
          <nldd-card>
            <nldd-container padding="24">
              <nldd-title
                text="MOZa op Fundament"
                heading-level="3"
                size="display-5"
              ></nldd-title>
              <nldd-spacer size="8"></nldd-spacer>
              <nldd-text text="De presentatie over MOZa op Fundament, met de live demo op de dia&#39;s."></nldd-text>
            </nldd-container>
            <nldd-container
              slot="footer"
              padding="24"
            >
              <nldd-button
                appearance="primary"
                text="Open de presentatie"
                end-icon="arrow-right"
                single-line
                href="/presentatie/index.html"
              ></nldd-button>
            </nldd-container>
          </nldd-card>
        </nldd-collection>

        <h2 class="start-kop">Functionaliteiten</h2>
        <nldd-collection
          class="start-keuzes"
          item-min-width="230px"
          gap="24"
        >
          <nldd-card>
            <nldd-container padding="24">
              <nldd-title
                text="Scenario btw-aangifte"
                heading-level="3"
                size="display-5"
              ></nldd-title>
              <nldd-spacer size="8"></nldd-spacer>
              <nldd-text text="Aangifte, beschikking en plaatsen in het magazijn van de Belastingdienst, met een losse notificatie."></nldd-text>
            </nldd-container>
            <nldd-container
              slot="footer"
              padding="24"
            >
              <nldd-button
                appearance="primary"
                text="Start het scenario"
                end-icon="arrow-right"
                single-line
                href="/scenario.html"
              ></nldd-button>
            </nldd-container>
          </nldd-card>
          <nldd-card>
            <nldd-container padding="24">
              <nldd-title
                text="Werkscherm"
                heading-level="3"
                size="display-5"
              ></nldd-title>
              <nldd-spacer size="8"></nldd-spacer>
              <nldd-text text="Losse berichten plaatsen en notificaties sturen, met logboek."></nldd-text>
            </nldd-container>
            <nldd-container
              slot="footer"
              padding="24"
            >
              <nldd-button
                appearance="primary"
                text="Open werkscherm"
                end-icon="arrow-right"
                single-line
                href="/werkscherm.html"
              ></nldd-button>
            </nldd-container>
          </nldd-card>
        </nldd-collection>

        <h2 class="start-kop">Portalen</h2>
        <nldd-collection
          class="start-keuzes"
          item-min-width="230px"
          gap="24"
        >
          <nldd-card>
            <nldd-container padding="24">
              <nldd-title
                text="MOZa portaal"
                heading-level="3"
                size="display-5"
              ></nldd-title>
              <nldd-spacer size="8"></nldd-spacer>
              <nldd-text text="De Berichtenbox van MijnOverheid Zakelijk: berichten lezen als ondernemer."></nldd-text>
            </nldd-container>
            <nldd-container
              slot="footer"
              padding="24"
            >
              <nldd-button
                appearance="primary"
                text="Open het MOZa portaal"
                end-icon="arrow-right"
                single-line
                href="/moza-portaal/index.html"
              ></nldd-button>
            </nldd-container>
          </nldd-card>
          <nldd-card>
            <nldd-container padding="24">
              <nldd-title
                text="BLD portaal gebruikers"
                heading-level="3"
                size="display-5"
              ></nldd-title>
              <nldd-spacer size="8"></nldd-spacer>
              <nldd-text text="Btw-aangifte doen als ondernemer. Roept onder water de procesapplicatie aan."></nldd-text>
            </nldd-container>
            <nldd-container
              slot="footer"
              padding="24"
            >
              <nldd-button
                appearance="primary"
                text="Open het BLD portaal"
                end-icon="arrow-right"
                single-line
                href="/procesapplicatie/index.html"
              ></nldd-button>
            </nldd-container>
          </nldd-card>
          <nldd-card>
            <nldd-container padding="24">
              <nldd-title
                text="Ambtenaar portaal"
                heading-level="3"
                size="display-5"
              ></nldd-title>
              <nldd-spacer size="8"></nldd-spacer>
              <nldd-text text="De werklijst btw-aangiften behandelen. Roept onder water de procesapplicatie aan."></nldd-text>
            </nldd-container>
            <nldd-container
              slot="footer"
              padding="24"
            >
              <nldd-button
                appearance="primary"
                text="Open het ambtenaar portaal"
                end-icon="arrow-right"
                single-line
                href="/procesapplicatie/werklijst.html"
              ></nldd-button>
            </nldd-container>
          </nldd-card>
        </nldd-collection>
      </main>

      <footer class="start-voet">
        <span><strong>MijnOverheid Zakelijk</strong> · Makkelijk zakendoen met de overheid</span>
        <a href="/instellingen.html">Instellingen</a>
      </footer>
    </div>
  </body>
</html>
